services:
  caddy:
    image: caddy:alpine
    container_name: nfl-fantasy-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
      - goaccess_report:/srv/report:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - fantasy-dashboard

  goaccess:
    image: allinurl/goaccess:latest
    container_name: nfl-fantasy-goaccess
    restart: unless-stopped
    entrypoint: >
      sh -c '
      mkdir -p /srv/logs /srv/report
      if [ ! -s /srv/logs/access.log ]; then
        echo "{\"ts\": 1727600000.0, \"request\": {\"remote_ip\": \"127.0.0.1\", \"method\": \"GET\", \"proto\": \"HTTP/2.0\", \"host\": \"nfl-fantasy-jonas.belgiumcentral.cloudapp.azure.com\", \"uri\": \"/\"}, \"status\": 200, \"size\": 100}" >> /srv/logs/access.log
      fi
      exec goaccess /srv/logs/access.log -o /srv/report/index.html --log-format=CADDY --real-time-html --ws-url=wss://nfl-fantasy-jonas.belgiumcentral.cloudapp.azure.com:443/goaccess-ws --port=7890
      '
    volumes:
      - caddy_logs:/srv/logs
      - goaccess_report:/srv/report
    depends_on:
      - caddy

  fantasy-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nfl-fantasy-dashboard
    restart: unless-stopped
    expose:
      - "8501"
    environment:
      - LEAGUE_ID=1390344846723543040
      - TEAM_NAME=wetschproblem
      - TZ=Europe/Zurich
      - SYNC_CRON=0,30 * * * *
      - VERSION=${VERSION:-1.7.3}
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./app.py:/app/app.py
      - ./scripts:/app/scripts

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  goaccess_report:
