version: '3.8'

services:
  fantasy-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nfl-fantasy-dashboard
    restart: unless-stopped
    ports:
      - "${PORT:-80}:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./app.py:/app/app.py
    environment:
      - LEAGUE_ID=${LEAGUE_ID}
      - TEAM_NAME=${TEAM_NAME}
      - TZ=${TZ:-Europe/Berlin}
