services:
  fantasy-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nfl-fantasy-dashboard
    restart: unless-stopped
    ports:
      - "80:8501"
    environment:
      - LEAGUE_ID=1390344846723543040
      - TEAM_NAME=wetschproblem
      - TZ=Europe/Zurich
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./app.py:/app/app.py
      - ./scripts:/app/scripts
