services:
  caddy:
    image: caddy:alpine
    container_name: nfl-fantasy-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
      - goaccess_report:/srv/report:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - fantasy-dashboard

  goaccess:
    image: allinurl/goaccess:latest
    container_name: nfl-fantasy-goaccess
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/run_goaccess.sh"]
    volumes:
      - ./scripts/run_goaccess.sh:/run_goaccess.sh:ro
      - caddy_logs:/srv/logs
      - goaccess_report:/srv/report
    depends_on:
      - caddy

  fantasy-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nfl-fantasy-dashboard
    restart: unless-stopped
    expose:
      - "8501"
    environment:
      - LEAGUE_ID=1390344846723543040
      - TEAM_NAME=wetschproblem
      - TZ=Europe/Zurich
      - SYNC_CRON=0,30 * * * *
      - VERSION=${VERSION:-1.7.3}
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./app.py:/app/app.py
      - ./scripts:/app/scripts

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  goaccess_report:
